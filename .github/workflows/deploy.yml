name: Build and deploy

on:
  push:
    branches: [main]
  pull_request:
  repository_dispatch:
    types: [content-updated]
  workflow_dispatch:
    inputs:
      content_ref:
        description: Content commit SHA or branch to build from
        default: main
        required: false

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.event_name == 'pull_request' && github.head_ref || 'production' }}
  cancel-in-progress: false

env:
  PAGES_PROJECT: haikutravels
  CONTENT_REPO: GavinTomlins/haiku-travels-content

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out site
        uses: actions/checkout@v4

      - name: Resolve content ref
        id: content
        run: |
          ref="${{ github.event.client_payload.sha || github.event.inputs.content_ref || 'main' }}"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"

      - name: Check out content at ${{ steps.content.outputs.ref }}
        uses: actions/checkout@v4
        with:
          repository: ${{ env.CONTENT_REPO }}
          ref: ${{ steps.content.outputs.ref }}
          path: content

      - name: Record content SHA
        id: sha
        run: echo "content=$(git -C content rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            content/package-lock.json

      - run: npm ci
      - run: npm ci --prefix content

      - name: Validate content
        run: npm run validate --prefix content

      - name: Build
        run: npm run build

      - name: Check for draft or private-field leaks
        run: npm run check:leaks

      - name: Ensure Pages project exists
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages project create "$PAGES_PROJECT" --production-branch main 2>/dev/null || true

      - name: Deploy to Cloudflare Pages
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          branch="${{ github.event_name == 'pull_request' && github.head_ref || 'main' }}"
          npx --yes wrangler@4 pages deploy _site \
            --project-name "$PAGES_PROJECT" \
            --branch "$branch" \
            --commit-hash "${{ github.sha }}" \
            --commit-message "site ${{ github.sha }} content ${{ steps.sha.outputs.content }}" \
            --commit-dirty=true

      - name: Summary
        run: |
          {
            echo "### Deployed"
            echo "- site: \`${{ github.sha }}\`"
            echo "- content: \`${{ steps.sha.outputs.content }}\` (${{ steps.content.outputs.ref }})"
          } >> "$GITHUB_STEP_SUMMARY"
